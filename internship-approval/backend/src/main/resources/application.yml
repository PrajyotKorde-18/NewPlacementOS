server:
  port: 8082
  servlet:
    context-path: /api

spring:
  application:
    name: internship-approval-backend
  profiles:
    default: demo
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/internship_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  auth:
    jwt-secret: ${JWT_SECRET:9f82d1c3a7b5e406214580cdfb3742ea1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d}
    jwt-expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
    allowed-email-domain: ${ALLOWED_EMAIL_DOMAIN:rknec.edu}
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:admin@rknec.edu}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:Admin@12345}
    admin-name: ${BOOTSTRAP_ADMIN_NAME:System CDPC Admin}
    admin-college-id: ${BOOTSTRAP_ADMIN_COLLEGE_ID:ADMIN001}
  policy:
    default-min-stipend: ${DEFAULT_MIN_STIPEND:10000}
    default-min-duration-weeks: ${DEFAULT_MIN_DURATION_WEEKS:6}
  noc:
    verification-secret: ${NOC_VERIFICATION_SECRET:}
  verification:
    base-url: ${VERIFICATION_BASE_URL:http://localhost:3001/verify-noc}
  notifications:
    enabled: ${NOTIFICATIONS_ENABLED:true}
    mail-from: ${MAIL_FROM:noreply@placementos.local}
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:3001}
  hr-confirmation:
    expiry-days: ${HR_CONFIRMATION_EXPIRY_DAYS:14}

logging:
  level:
    com.placementos.internship: DEBUG
    org.springframework.security: INFO
