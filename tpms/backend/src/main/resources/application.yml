server:
  port: 8081
  servlet:
    context-path: /api

spring:
  application:
    name: tpms-backend
  profiles:
    default: demo
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/tpms_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 4
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  notifications:
    enabled: ${NOTIFICATIONS_ENABLED:false}
    mail-from: ${MAIL_FROM:noreply@placementos.local}
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  admin:
    cleanup-enabled: false
  upload:
    dir: uploads/resumes
  resume:
    thread-pool:
      core-size: 2
      max-size: 4
      queue-capacity: 10
      thread-name-prefix: TPMS-Resume-Async-
  bootstrap:
    coordinator-email: ${BOOTSTRAP_COORDINATOR_EMAIL:coord_user@rknec.edu}
    coordinator-password: ${BOOTSTRAP_COORDINATOR_PASSWORD:Coord@12345}
  auth:
    jwt-secret: ${JWT_SECRET:9f82d1c3a7b5e406214580cdfb3742ea1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d}
    jwt-expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
    allowed-email-domain: ${ALLOWED_EMAIL_DOMAIN:rknec.edu}
  groq:
    api-key: ${GROQ_API_KEY:}
    mock-mode: ${GROQ_MOCK_MODE:true}
    model: ${GROQ_MODEL:groq/compound-mini}

logging:
  level:
    com.placementos.tpms: DEBUG
    org.springframework.security: INFO
