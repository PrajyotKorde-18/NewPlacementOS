server:
  port: 8081
  servlet:
    context-path: /api

spring:
  application:
    name: tpms-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/tpms_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

app:
  bootstrap:
    coordinator-email: ${BOOTSTRAP_COORDINATOR_EMAIL:coord_user@rknec.edu}
    coordinator-password: ${BOOTSTRAP_COORDINATOR_PASSWORD:}
  auth:
    jwt-secret: ${JWT_SECRET:}
    jwt-expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
    allowed-email-domain: ${ALLOWED_EMAIL_DOMAIN:rknec.edu}
  groq:
    api-key: ${GROQ_API_KEY:}
    mock-mode: ${GROQ_MOCK_MODE:false}
    model: ${GROQ_MODEL:groq/compound-mini}

logging:
  level:
    com.placementos.tpms: DEBUG
    org.springframework.security: INFO
