server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:tpms_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
